name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3']
        wp: ['latest']
        mysql: ['8.0']

        include:
          - php: '8.3'
            wp: '6.6'
            mysql: '8.0'
          - php: '8.4'
            wp: 'latest'
            mysql: '8.0'
            experimental: true
          - php: '8.5'
            wp: 'latest'
            mysql: '8.0'
            experimental: true

    name: "PHP ${{ matrix.php }} - WP ${{ matrix.wp }} - MySQL ${{ matrix.mysql }}"
    continue-on-error: ${{ matrix.experimental == true }}

    env:
      WP_CORE_DIR: /tmp/wordpress

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Set up WordPress test environment
        run: |
          sudo apt-get install -y subversion
          bash phpunit/install.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}

      - name: Run tests (single site)
        run: vendor/bin/phpunit

      - name: Run tests (multisite)
        env:
          WP_MULTISITE: 1
        run: vendor/bin/phpunit

      - name: Run content processor regression suite
        run: php phpunit/regression.php "$WP_CORE_DIR"

  modal-js:
    runs-on: ubuntu-latest
    name: "Modal script tests"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run modal script tests
        run: node --test phpunit/modal.test.js